name: Build my TV
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: My settings
        run: |
          cat > profiles/my.local.json <<'EOF'
          {
            "city": {"name": "إيستلي", "latitude": 50.967, "longitude": -1.350, "timezone": "Europe/London"},
            "prayer": {"method": 15, "label": "لجنة رؤية الهلال"},
            "team": {"name": "الهلال", "provider": "alhilal", "id": "929", "leagues": ["ksa.1"]},
            "apps": [
              {"id": "com.google.android.youtube.tv", "name": "YouTube"},
              {"id": "com.netflix.ninja", "name": "Netflix"},
              {"id": "uk.co.bbc.iplayer", "name": "BBC iPlayer"}
            ],
            "panels": {"showPrayers": true, "showMatches": true, "showWeather": true}
          }
          EOF
          python3 scripts/configure.py --profile profiles/my.local.json
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-tv-app
          path: app/build/outputs/apk/debug/app-debug.apk
